# 绒球 · 面类别词表
#
# 用途（两处，同一份词表）：
#   1. configs/questions.yaml 里每个问句标注它探测的面；
#   2. scripts/mine_surfaces.py 给矿出来的「考虑」打标签。
#
# 两层标签：
#   mk       理论分类（FOUNDATIONS §1 马尔可夫毯）——必填、单选
#            cause 直接因 / effect 直接果 / common 共同原因
#   domains  面类别——展示用标签，**可多选**
#            来自 548 条实测考虑的归纳（2026-10-20），保留细粒度；
#            用 4109 条实测复检后加了「信息真伪」，现为 16 类
#
# 边界：
#   - domains 不参与 811、不参与方向判定、不影响置信度；
#   - 它只用于展示、覆盖检查和「哪些面还没被答到」的枚举；
#   - 增删改这份词表 = 改问句库的标注体系，改完跑一遍测试。

# mk 的判据（按顺序，给问句标注的人用；矿工的抽取器也用同一套）：
#   1. 说的是「做了之后会发生什么」→ effect
#   2. 是「我这个人」的稳定背景（性格、和某人的关系模式、习惯、身份、长期期待、
#      长期处境）→ common
#   3. 其余 → cause（这次的具体触发或约束）
# 注意：通用事实、政策、行情、行业规律不是 common。
mk:
  - id: cause
    name: 直接因
    definition: 这次的具体触发或约束——这次谁邀请、这次的时间/地点/人员、这次的临时状态；只对这一次成立。
  - id: effect
    name: 直接果
    definition: 做了之后会发生什么——后果、感受、改变（看向未来）。
  - id: common
    name: 共同原因
    definition: 「我这个人」的稳定背景——性格、和某人的关系模式、习惯、身份、长期期待、长期处境；换成同类事情仍成立。通用事实/政策/行情/行业规律不算。

domains:
  - name: 经济负担
    definition: 决策涉及的花费、收入、预算与财务承受能力。
  - name: 心理感受
    definition: 决策带来的焦虑、疲惫、内耗、快乐等情绪体验。
  - name: 风险不确定
    definition: 决策结果的不确定性、失败概率与潜在损失。
  - name: 信息真伪
    definition: 对信息真实性、对方诚信、隐藏套路的怀疑与核实需求。
  - name: 个人适配
    definition: 决策是否契合自身性格、能力、偏好与生活习惯。
  - name: 条件门槛
    definition: 决策需要满足的资格、能力、学历、年龄、身体指标等硬性条件。
  - name: 时间成本
    definition: 决策需要投入的时间、精力以及机会成本。
  - name: 生活便利
    definition: 决策对日常通勤、居住、出行等生活便利程度的影响。
  - name: 人际压力
    definition: 来自同事、亲友、社会舆论等他人的期待与评价压力。
  - name: 健康风险
    definition: 决策对身体健康、术后后遗症或长期身体状况的影响。
  - name: 职业发展
    definition: 决策对工作前景、晋升、技能积累和职业路径的影响。
  - name: 家庭责任
    definition: 决策对家人、子女、父母及家庭整体安排的影响。
  - name: 价值回报
    definition: 决策投入与所获收益、性价比及长期价值的比较。
  - name: 稳定保障
    definition: 决策对收入稳定性、编制、福利和抗风险能力的考量。
  - name: 关系维系
    definition: 决策对现有亲密关系、友情或家庭关系的影响。
  - name: 其他
    definition: 放不进上面任何一类的。
