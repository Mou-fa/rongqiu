# 主动询问的问题库
#
# 这里只放「经典万能句」——不随机发挥。
# 原则（由用户从心理咨询师角度确定）：
#   问行为，不问动机
#   问过去，不问现在
#   不问「为什么」
#   跨文化普适
#   能二元回答（是 / 否）
#
# 每条的字段：
#   id        唯一标识
#   text      问句本身。{resource} 会被替换成原核的资源；不写就不替换
#   when      什么时候问：always / first_time
#   polarity  这句答「是」对原核意味着什么：
#               positive = 答是 → 倾向会（默认）
#               negative = 答是 → 倾向不会
#   mk        这句探测的是哪一类面（FOUNDATIONS §1 马尔可夫毯）：必填、单选
#               cause = 直接因 / effect = 直接果 / common = 共同原因
#   domains   面类别：展示用标签，**可多选**，取值见 configs/taxonomy.yaml
#               不参与 811、不参与方向判定、不影响置信度
#   why       为什么这句有效（留档，不展示给用户）
#
# 系统不会自己增删问题。这里有多少条，就问多少条；加一条，固定询问面就多一个。

# ---
# 2026-10-20：从 4064 条实测语料里批量起草、经使用者全部审定后导入（52 条）。
# 每条带 mk（理论三类，单选）+ domains（16 类，可多选）。
# note 是导入时的待核标记，不参与计算；复核后可删。
questions:
- id: last_time
  text: 你上一次遇到这种情况，最后怎么选的？
  when: always
  polarity: positive
  mk: common
  domains:
  - 个人适配
  why: '问行为不问动机，问过去不问现在。回答时用户是在陈述事实而不是解释自己， 没有防御。而过去的行为比当下的意愿更能预测下一次——这是关于「这个人」 最硬的一条数据。

    '
- id: still_waiting
  text: 这件事你已经反复想了一阵子，是吗？
  when: always
  polarity: positive
  mk: common
  domains:
  - 心理感受
  why: '人不会为不在乎的事反复纠结。只有重要的、想要的、怕失去的东西， 才值得在脑子里来回权衡。所以「反复想了一阵子」这个行为本身， 泄露的不是犹豫，是在乎——而在乎的方向，就是想去的方向。

    第一版把极性定成了 negative（以为纠结等于卡住，卡住就不做）， 这是从旁观者的逻辑推的，不是从人的心理推的。用户纠正： 潜意识里是想去的。所以答「是」→ 支持。

    '
