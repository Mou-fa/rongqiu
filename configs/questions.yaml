# 主动询问的问题库
#
# 这里只放「经典万能句」——不随机发挥。
# 原则（由用户从心理咨询师角度确定）：
#   问行为，不问动机
#   问过去，不问现在
#   不问「为什么」
#   跨文化普适
#
# 每条的字段：
#   id      唯一标识
#   text    问句本身。{resource} 会被替换成原核的资源；不写就不替换
#   when    什么时候问：always / first_time（还没有历史时）
#   why     为什么这句有效（留档，不展示给用户）
#
# 系统不会自己增删问题。这里有多少条，就问多少条。

questions:
  - id: last_time
    text: "你上一次遇到这种情况，最后怎么选的？"
    when: always
    why: >
      问行为不问动机，问过去不问现在。回答时用户是在陈述事实而不是解释自己，
      没有防御。而过去的行为比当下的意愿更能预测下一次——这是关于「这个人」
      最硬的一条数据。
