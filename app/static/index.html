<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>绒球</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span class="dot"></span> 绒球</div>
    <div class="sub">用真实发生过的事，判断一件你还没决定的事</div>
  </header>

  <section id="step-ask" class="panel">
    <label class="label">你现在要决定什么？</label>
    <textarea id="question" rows="3" placeholder="把你的处境一起说出来，比如：今天身体不舒服，能不能去聚餐？"></textarea>
    <div class="examples">
      <span>试试：</span>
      <button class="chip" data-q="今天身体不舒服，绒球你觉得能不能去聚餐？">身体不舒服，去不去聚餐</button>
      <button class="chip" data-q="最近很累，我要不要换工作？">很累，要不要换工作</button>
      <button class="chip" data-q="钱包有点紧，我要不要买这个手机？">钱紧，要不要买手机</button>
    </div>
    <button id="btn-ask" class="primary">开始判断</button>
    <p class="hint">你把自己的处境说得越清楚，系统的第一接触面就越多。</p>
  </section>

  <section id="step-result" class="panel hidden">
    <div class="nucleus">
      <div class="label">我理解你在问</div>
      <div class="svo" id="svo"></div>
    </div>

    <div id="stated-wrap" class="stated hidden">
      <div class="label">你自己说出的处境</div>
      <div id="stated"></div>
    </div>

    <div class="label" style="margin-top:20px">结构</div>
    <div id="structure"></div>

    <div id="prompts"></div>

    <button id="btn-again" class="ghost">再问一个</button>
  </section>

  <footer>判断是趋近值，不是断言 · 已入档，7 天后可回收结果</footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
