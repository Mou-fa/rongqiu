<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>绒球</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span class="dot"></span> 绒球</div>
    <div class="sub">用真实发生过的事，判断一件你还没决定的事</div>
  </header>

  <section id="step-ask" class="panel">
    <label class="label">你现在要决定什么？</label>
    <textarea id="question" rows="2" placeholder="例如：我能不能去参加今晚的聚会"></textarea>
    <div class="examples">
      <span>试试：</span>
      <button class="chip" data-q="我能不能去参加今晚的聚会">今晚的聚会去不去</button>
      <button class="chip" data-q="我应不应该换工作">要不要换工作</button>
      <button class="chip" data-q="我要不要买这个手机">要不要买手机</button>
      <button class="chip" data-q="我要不要学英语">要不要学英语</button>
      <button class="chip" data-q="我要不要去健身房">要不要去健身房</button>
      <button class="chip" data-q="我要不要接受这个offer">要不要接 offer</button>
    </div>
    <button id="btn-ask" class="primary">开始判断</button>
    <p class="hint">系统会自动拆解问题、匹配全网同类场景、给出结论。你不需要做任何操作。</p>
  </section>

  <section id="step-result" class="panel hidden">
    <div class="nucleus">
      <div class="label">我理解你在问</div>
      <div class="svo" id="svo"></div>
    </div>

    <div id="stated-wrap" class="stated hidden">
      <div class="label">你自己说出的处境</div>
      <div id="stated"></div>
    </div>

    <div class="label" style="margin-top:20px">结构</div>
    <div class="metrics" id="metrics"></div>
    <div class="split-line" id="split-line"></div>

    <div class="label" style="margin-top:20px">依据（全部公开）</div>
    <ul class="evidence" id="evidence"></ul>
    <div class="slots" id="slots"></div>

    <div class="tiny-ref">
      <span>系统参考倾向</span>
      <b id="lean"></b>
      <span id="conf"></span>
    </div>

    <div id="refine-bar" class="refine">
      <span id="refine-note"></span>
      <button id="btn-refine" class="ghost small">细化判断（可选）</button>
    </div>
    <button id="btn-again" class="ghost">再问一个</button>
  </section>

  <section id="step-pick" class="panel hidden">
    <div class="label">哪些场景真的是你的情况？</div>
    <p class="hint">系统默认假设<b>全部</b>适用。你点选真正符合的，结论会更准；不选也能看结果。</p>
    <div id="candidates" class="cands"></div>
    <div class="bar">
      <span id="picked-count">已选 0 条</span>
      <button id="btn-judge" class="primary">重新计算</button>
    </div>
    <button id="btn-back" class="ghost">返回</button>
  </section>

  <footer>判断是趋近值，不是断言 · 已入档，7 天后可回收结果</footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
